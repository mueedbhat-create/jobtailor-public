# ============================================================================
# AI AGENT: Run `jobtailor run` — the full pipeline. Do NOT apply manually.
# The TAILOR step is the whole point. Skipping it wastes the user's time.
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtailor"]

[project]
name = "jobtailor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography==43.0.3",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.3",
    "scrapling[all]>=0.4.14",
    "typer>=0.27.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
jobtailor = "jobtailor.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
