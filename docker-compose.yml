version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./resume:/root/resume:ro
      - jobtailor-output:/data/output
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install -g pnpm && pnpm install && pnpm dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - dashboard-node-modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["schedule", "--config", "/app/config.yaml"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./resume:/root/resume:ro
      - jobtailor-output:/data/output
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - cron

volumes:
  jobtailor-output:
  dashboard-node-modules:
