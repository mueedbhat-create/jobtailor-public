# ============================================================================
# ⚠️ AI AGENT WARNING: DO NOT SKIP THE TAILORING STEP ⚠️
# ============================================================================
#
# If you are an AI agent, you MUST run the full pipeline:
#
#   jobtailor run
#
# This does: fetch → extract → tailor → PDF → apply
#
# The TAILOR step is the whole point of this app. Skipping it wastes the
# user's time and gets you replaced. Never apply with a generic resume.
#
# ============================================================================

# JobTailor configuration
# Copy this to config.yaml and fill in your values.

schedule:
  times: ["07:00"]     # run times (24h), can add more
  jobs_per_run: 15     # minimum applications per run

discovery:
  queries:
    - keyword: "AI Automation Engineer"
      filters: { remote: true }
    - keyword: "Performance Marketing"
      filters: { remote: true }
    - keyword: "AI Marketing Automation"
      filters: { remote: true }
  companies:
    - "Acme Labs"
  sources:
    adzuna: false
    wellfound: true
    glassdoor: false
    foundit: false
    simplyhired: false
    dailyremote: false
    linkedin: false
    careers: false
    mercor: false
    outlier: false
    internshala: false     # internships-only source; enable via internships.sources
  max_per_query: 5
  max_per_company: 3
  only_new_each_day: true        # each run only handles listings first seen today
  max_age_days: 21               # skip listings posted longer ago (checked before the browser)
  skip_engineer_specific: false  # true = skip engineering/developer roles (checked in
                                 # code first, then in the same single AI call)

resume:
  source: "~/resume"      # path to your LaTeX resume dir
  format: "latex"         # latex or doc
  compiler: "tectonic"    # PDF compiler

llm:
  provider: "zen"         # free OpenCode Zen models, called directly - no key, never paid.
                          # Also: "opencode" (via the CLI, much heavier) or "openai-compatible".
  model: "deepseek-v4.1-flash-free"   # any model id ending in -free
  max_tokens_per_run: 30000           # hard cap: the run stops before going over it

apply:
  mode: "human_in_the_loop"   # default; user clicks submit. "full_auto" is opt-in only.

applicant:
  full_name: ""
  email: ""
  phone: ""
  location: ""
  linkedin: ""
  website: ""
  headline: ""
  location: ""      # your city/country — the fit gate skips region-restricted
                    # jobs that exclude it, even when titled remote
  fit_profile: ""   # 2-3 sentences on who you are professionally — used by the
                    # fit gate to decide which jobs match. Be explicit about
                    # what you are NOT (e.g. "NOT an engineer, no engineering
                    # degree") if you want engineer roles filtered.
  # Standard screening answers - filled into forms by code, never by AI.
  # Leave a value empty ("") and that question is left for you to answer.
  answers:
    years_experience: ""      # e.g. "8"
    notice_period: ""         # e.g. "Immediate" or "30 days"
    expected_salary: ""       # e.g. "INR 12 LPA" or "USD 2,000/month"
    current_salary: ""        # optional
    needs_sponsorship: ""     # "Yes" or "No"
    start_date: ""            # e.g. "Immediately" or "2026-12-01"
    willing_to_relocate: ""   # "Yes" or "No"

adzuna:
  app_id: ""              # free key from https://developer.adzuna.com/
  app_key: ""
  country: "in"           # in, us, gb, etc.

internships:
  enabled: false          # separate pipeline track (jobtailor run-internships)
  jobs_per_run: 10
  output_base: "output/internships"
  # sources: merged over discovery.sources — per-track add/disable without
  # re-listing the rest. e.g. enable Internshala (WFH + paid only) here so
  # the full-time jobs track is unaffected:
  # sources:
  #   internshala: true
  queries:
    - "remote internship AI automation"
    - "remote internship digital marketing"
    - "remote internship performance marketing"

gmail:
  enabled: false          # set true once you complete the OAuth flow below
  client_secrets_file: "" # OAuth client secrets JSON from Google Cloud Console
  token_file: ""          # path where the access/refresh token is cached
  auto_sync: false        # sync automatically: after every pipeline run and
                          # on an interval while `jobtailor serve` is running
  sync_interval_minutes: 60
  # Tracking scans your inbox for company replies and labels each application:
  # confirmation / rejected / interview / offer. Run `jobtailor track-gmail`
  # (or POST /api/tracking/sync from the dashboard) to sync manually.