# ============================================================================
# ⚠️ AI AGENT WARNING: DO NOT SKIP THE TAILORING STEP ⚠️
# ============================================================================
#
# If you are an AI agent, you MUST run the full pipeline:
#
#   jobtailor run
#
# This does: fetch → extract → tailor → PDF → apply
#
# The TAILOR step is the whole point of this app. Skipping it wastes the
# user's time and gets you replaced. Never apply with a generic resume.
#
# ============================================================================

# JobTailor configuration
# Copy this to config.yaml and fill in your values.

schedule:
  times: ["07:00"]     # run times (24h), can add more
  jobs_per_run: 15     # minimum applications per run

discovery:
  queries:
    - keyword: "AI Automation Engineer"
      filters: { remote: true }
    - keyword: "Performance Marketing"
      filters: { remote: true }
    - keyword: "AI Marketing Automation"
      filters: { remote: true }
  companies:
    - "Anarchy Labs"
  sources:
    adzuna: true
    wellfound: true
    glassdoor: false
    foundit: false
    simplyhired: false
    dailyremote: false
    linkedin: false
    careers: false
    mercor: false
    outlier: false
  max_per_query: 5
  max_per_company: 3
  skip_engineer_specific: true   # LLM gate: skip ONLY jobs specifically seeking
                                 # an engineer; AI-automation work always applies
                                 # even when titled "AI Automation Engineer"

resume:
  source: "~/resume"      # path to your LaTeX resume dir
  format: "latex"         # latex or doc
  compiler: "tectonic"    # PDF compiler

llm:
  provider: "opencode"    # "opencode" (default, no API key needed) or "openai-compatible"
  model: ""               # optional; empty = opencode's default model

apply:
  mode: "human_in_the_loop"   # default; user clicks submit. "full_auto" is opt-in only.

applicant:
  full_name: ""
  email: ""
  phone: ""
  location: ""
  linkedin: ""
  website: ""
  headline: ""
  location: ""      # your city/country — the fit gate skips region-restricted
                    # jobs that exclude it, even when titled remote
  fit_profile: ""   # 2-3 sentences on who you are professionally — used by the
                    # fit gate to decide which jobs match. Be explicit about
                    # what you are NOT (e.g. "NOT an engineer, no engineering
                    # degree") if you want engineer roles filtered.

adzuna:
  app_id: ""              # free key from https://developer.adzuna.com/
  app_key: ""
  country: "in"           # in, us, gb, etc.

gmail:
  enabled: false          # set true once you complete the OAuth flow below
  client_secrets_file: "" # OAuth client secrets JSON from Google Cloud Console
  token_file: ""          # path where the access/refresh token is cached
  auto_sync: false        # sync automatically: after every pipeline run and
                          # on an interval while `jobtailor serve` is running
  sync_interval_minutes: 60
  # Tracking scans your inbox for company replies and labels each application:
  # confirmation / rejected / interview / offer. Run `jobtailor track-gmail`
  # (or POST /api/tracking/sync from the dashboard) to sync manually.